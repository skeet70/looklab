<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="looklab: measure, compare and reproduce camera looks from static data." />
    <title>looklab</title>
    <link rel="icon" href="__PREFIX__favicon.ico" sizes="32x32" type="image/x-icon" />
    <link rel="stylesheet" href="__PREFIX__styles.css" />
    <link rel="stylesheet" href="__PREFIX__base.css" />
    <link rel="stylesheet" href="__PREFIX__components.css" />
    <link rel="stylesheet" href="__PREFIX__home.css" />
    <link rel="stylesheet" href="__PREFIX__looks.css" />
    <link rel="stylesheet" href="__PREFIX__compare.css" />
    <link rel="stylesheet" href="__PREFIX__match.css" />
    <link rel="stylesheet" href="__PREFIX__account.css" />
    <link rel="stylesheet" href="__PREFIX__contribute.css" />
    <link rel="stylesheet" href="__PREFIX__community.css" />
    <link rel="stylesheet" href="__PREFIX__developers.css" />
    <script
      src="__PREFIX__errors.js"
      data-release="__RELEASE__"
      data-api-base="__API_BASE__"
      data-preview="__PREVIEW__"
    ></script>
  </head>
  <body>
    <script type="module">
      // base.rs reads the public prefix from this stylesheet link, so it stays ahead of the module.
      const stylesheet = document.querySelector('link[rel="stylesheet"]');
      const prefix = new URL(stylesheet.href).pathname.replace(/[^/]*$/, '');
      const { default: init } = await import(prefix + 'pkg/looklab-site.js');
      init({ module_or_path: prefix + 'pkg/looklab-site.wasm' });
    </script>
  </body>
</html>
