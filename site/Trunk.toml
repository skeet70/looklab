[build]
target = "index.html"
dist = "dist"
# Pages builds with --public-url /looklab/.
#
# LOOKLAB_PREVIEW=1 disables server-backed actions. LOOKLAB_API_BASE names the API origin;
# unset or empty is the page's own origin.
public_url = "/"
filehash = false

[[hooks]]
stage = "pre_build"
command = "sh"
command_arguments = ["scripts/wasm-assets.sh"]
