[package]
name = "looklab-worker"
description = "Job runner and static-site publisher."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
integration = []
full-scale = ["integration"]

[[bin]]
name = "looklab-worker"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
looklab-body.workspace = true
looklab-color.workspace = true
looklab-fit.workspace = true
looklab-match.workspace = true
looklab-meta.workspace = true
looklab-model.workspace = true
looklab-export.workspace = true
looklab-publish = { workspace = true, features = ["scene-sources"] }
looklab-samples.workspace = true
looklab-schema = { workspace = true, features = ["fs"] }
looklab-server.workspace = true
looklab-trust.workspace = true
looklab-upload.workspace = true
libm.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = { workspace = true, features = ["v4"] }

[build-dependencies]
sha2.workspace = true
toml.workspace = true

[dev-dependencies]
looklab-fit = { workspace = true, features = ["synth"] }
tempfile.workspace = true

[lints]
workspace = true
