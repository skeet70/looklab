looklab-match.workspace = true
looklab-meta.workspace = true
looklab-model.workspace = true
looklab-prep.workspace = true
looklab-prep-module.workspace = true
looklab-publish.workspace = true
looklab-raw.workspace = true
looklab-report.workspace = true
looklab-samples.workspace = true
looklab-schema = { workspace = true, features = ["fs"] }
looklab-server.workspace = true
looklab-trust.workspace = true
looklab-upload.workspace = true
looklab-worker.workspace = true
postcard.workspace = true
same-file.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
