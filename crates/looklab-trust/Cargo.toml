[package]
name = "looklab-trust"
description = "Contribution weights, tiers, reputation, caps, release gates and the red-team harness."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
# Builds the simulator only; it needs looklab-fit and does not target wasm.
harness = ["dep:looklab-fit", "dep:looklab-color", "dep:looklab-body"]
full-scale = ["harness"]

[dependencies]
libm.workspace = true
serde.workspace = true
thiserror.workspace = true
postcard.workspace = true
looklab-meta.workspace = true
looklab-model.workspace = true
looklab-upload.workspace = true
looklab-fit = { workspace = true, features = ["synth"], optional = true }
looklab-color = { workspace = true, optional = true }
looklab-body = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true

[[test]]
name = "redteam"
required-features = ["full-scale"]

[[test]]
name = "compact"
required-features = ["harness"]

[[test]]
name = "gauges"
required-features = ["harness"]

[lints]
workspace = true
