[package]
name = "looklab-fit"
description = "Single-body, joint and hierarchical Look fits, uncertainty and outlier scoring."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
# `synth` is reused by the trust red-team harness and by report/export tests.
synth = ["dep:rand_chacha"]
# Long recovery cases; ordinary CI runs only tests that finish within 120 s solo.
long-tests = ["synth"]
# Full-scale studies run the complete recovery inventory, including the long cases.
full-scale = ["long-tests"]

[dependencies]
looklab-body.workspace = true
looklab-color.workspace = true
looklab-samples.workspace = true
looklab-model.workspace = true
looklab-schema.workspace = true
libm.workspace = true
serde.workspace = true
thiserror.workspace = true
rand_chacha = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
serde_json.workspace = true
sha2.workspace = true

[[bench]]
name = "fit"
harness = false
required-features = ["full-scale"]

[[test]]
name = "sigma_stability"
required-features = ["full-scale"]

[[test]]
name = "fit"
required-features = ["long-tests"]

[[test]]
name = "uncertainty_study"
required-features = ["long-tests"]

[lints]
workspace = true
