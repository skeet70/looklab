[workspace]
resolver = "3"
members = ["crates/*", "xtask", "site"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.99"

[workspace.dependencies]
looklab-body = { path = "crates/looklab-body" }
looklab-color = { path = "crates/looklab-color" }
looklab-raw = { path = "crates/looklab-raw" }
looklab-meta = { path = "crates/looklab-meta" }
looklab-samples = { path = "crates/looklab-samples" }
looklab-prep = { path = "crates/looklab-prep" }
looklab-model = { path = "crates/looklab-model" }
looklab-fit = { path = "crates/looklab-fit" }
looklab-match = { path = "crates/looklab-match" }
looklab-export = { path = "crates/looklab-export" }
looklab-trust = { path = "crates/looklab-trust" }
looklab-schema = { path = "crates/looklab-schema" }
looklab-report = { path = "crates/looklab-report" }
looklab-upload = { path = "crates/looklab-upload" }
looklab-wasm = { path = "crates/looklab-wasm" }
looklab-prep-module = { path = "crates/looklab-prep-module" }
looklab-publish = { path = "crates/looklab-publish" }
looklab-web = { path = "crates/looklab-web" }
looklab-server = { path = "crates/looklab-server" }
looklab-worker = { path = "crates/looklab-worker" }

libm = "0.2"
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
saphyr-parser = "0.3"
postcard = { version = "1", features = ["alloc"] }
ruzstd = { version = "0.9", default-features = false, features = ["std"] }
proptest = "1"
criterion = { version = "0.7", default-features = false }

zip = { version = "2", default-features = false }
png = "0.18"

rawler = "0.8"
uuid = { version = "1", features = ["js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen-test = "=0.3.79"
toml = "0.8"
rand_chacha = "0.9"
sha2 = "0.10"
hmac = "0.12"
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
ciborium = "0.2"
base64 = "0.22"
jpeg-encoder = "0.6"
zune-jpeg = { version = "0.5", default-features = false, features = ["std"] }
roxmltree = "0.21"
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "matched-path", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
http-body-util = "0.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
webauthn-rs = "0.6"
webauthn-authenticator-rs = { version = "0.6", features = ["softpasskey"] }
tempfile = "3"
wasmtime = "50"
clap = { version = "4", features = ["derive"] }
assert_cmd = "2"
leptos = { version = "0.8", default-features = false, features = ["csr"] }
leptos_router = "0.8"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
console_error_panic_hook = "0.1"
gloo-net = { version = "0.6", features = ["http"] }
p256 = { version = "0.14", features = ["ecdsa"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.test]
opt-level = 1
