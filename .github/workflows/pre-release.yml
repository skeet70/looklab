name: Pre-release integration

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"

jobs:
  trust_integration:
    name: compact fitter-to-trust integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          fixtures: "false"
      - uses: ./.github/actions/cache
        with:
          mode: restore
          family: trust-integration
          salt: release-integration-compact
          paths: |
            target/.rustc_info.json
            target/release/deps
            target/release/build
            target/release/.fingerprint
      - name: Compact fitter-to-trust contracts
        run: nix develop -c cargo nextest run --locked -p looklab-trust --features integration --release --test compact --no-fail-fast --ignore-default-filter
      - uses: ./.github/actions/cache
        if: ${{ !cancelled() }}
        with:
          mode: save
          family: trust-integration
          salt: release-integration-compact
          paths: |
            target/.rustc_info.json
            target/release/deps
            target/release/build
            target/release/.fingerprint

  worker_integration:
    name: worker fitter-to-trust integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          fixtures: "false"
      - uses: ./.github/actions/cache
        with:
          mode: restore
          family: worker-integration
          salt: release-worker-integration
          paths: |
            target/.rustc_info.json
            target/release/deps
            target/release/build
            target/release/.fingerprint
      - name: Worker fitter-to-trust contracts
        run: nix develop -c cargo nextest run --locked -p looklab-worker --features integration --release --test worker --no-fail-fast --ignore-default-filter
      - uses: ./.github/actions/cache
        if: ${{ !cancelled() }}
        with:
          mode: save
          family: worker-integration
          salt: release-worker-integration
          paths: |
            target/.rustc_info.json
            target/release/deps
            target/release/build
            target/release/.fingerprint
