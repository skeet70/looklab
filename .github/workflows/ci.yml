name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          fixtures: "false"
      - uses: ./.github/actions/cache
        with:
          mode: restore
          family: lint
          salt: fmt-clippy-all-targets-check-web-wasm32
          paths: |
            target/.rustc_info.json
            target/debug/deps
            target/debug/build
            target/debug/.fingerprint
            target/wasm32-unknown-unknown/debug/deps
            target/wasm32-unknown-unknown/debug/build
            target/wasm32-unknown-unknown/debug/.fingerprint
      - name: Format
        run: nix develop -c cargo fmt --all --check
      - name: Build cache boundaries
        run: nix develop -c python3 -m unittest discover -s tools/tests -v
      - name: Clippy
        run: nix develop -c cargo clippy --workspace --all-targets -- -D warnings
      - name: Web client clippy (wasm32)
        run: nix develop -c cargo clippy -p looklab-web --target wasm32-unknown-unknown -- -D warnings
      - name: Float method allow-list
        run: nix develop -c cargo xtask float-methods
      - name: SPDX headers
        run: nix develop -c cargo xtask spdx
      - uses: ./.github/actions/cache
        if: ${{ !cancelled() }}
        with:
          mode: save
          family: lint
          salt: fmt-clippy-all-targets-check-web-wasm32
          paths: |
            target/.rustc_info.json
            target/debug/deps
            target/debug/build
            target/debug/.fingerprint
            target/wasm32-unknown-unknown/debug/deps
            target/wasm32-unknown-unknown/debug/build
            target/wasm32-unknown-unknown/debug/.fingerprint

  native:
    name: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/cache
        with:
          mode: restore
          family: native-test
          salt: test-workspace-fit-synth
          paths: |
            target/.rustc_info.json
            target/debug/deps
            target/debug/build
            target/debug/.fingerprint
      - uses: ./.github/actions/cache
        with:
          mode: restore
          family: wasm-assets
          salt: wasm-assets-release-worker-scene-prep
          paths: |
            target/wasm32-unknown-unknown/release/deps
            target/wasm32-unknown-unknown/release/build
            target/wasm32-unknown-unknown/release/.fingerprint
      - uses: ./.github/actions/cache
        with:
          mode: restore
          family: wasm-products
          salt: site-generated
          paths: |
            site/generated/wasm
            target/build-products/wasm
      - name: Prep and scene wasm artifacts
        id: wasm-assets
        run: nix develop -c sh site/scripts/wasm-assets.sh --prep --scene
      - name: Prep and scene import policy
        run: nix develop -c sh site/scripts/wasm-assets.sh --check --prep --scene
      - name: Build product receipts
        run: nix develop -c python3 -m unittest discover -s tools/tests -v
      - name: Test
        run: nix develop -c cargo test --workspace --features looklab-fit/synth --no-fail-fast
      - name: Community data snapshots
        run: |
          if compgen -G "data/community/v*" > /dev/null; then
            for dir in data/community/v*; do
              nix develop -c cargo run -p looklab-cli -- validate-snapshot "$dir"
            done
          else
            echo "no community data snapshots present"
          fi
      - uses: ./.github/actions/cache
        if: ${{ !cancelled() }}
        with:
          mode: save
          family: native-test
          salt: test-workspace-fit-synth
          paths: |
            target/.rustc_info.json
            target/debug/deps
            target/debug/build
            target/debug/.fingerprint
      - uses: ./.github/actions/cache
        if: ${{ !cancelled() }}
        with:
          mode: save
          family: wasm-assets
          salt: wasm-assets-release-worker-scene-prep
          paths: |
            target/wasm32-unknown-unknown/release/deps
            target/wasm32-unknown-unknown/release/build
            target/wasm32-unknown-unknown/release/.fingerprint
      - uses: ./.github/actions/cache
        if: ${{ !cancelled() && steps.wasm-assets.outcome == 'success' }}
        with:
          mode: save
          family: wasm-products
          salt: site-generated
          paths: |
            site/generated/wasm
            target/build-products/wasm

  wasm_release:
    name: wasm release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/cache
        with:
          mode: restore
          family: wasm-gates
          salt: node-wasm-core-bitid
          paths: |
            target/.rustc_info.json
            target/debug/deps
            target/debug/build
            target/debug/.fingerprint
            target/release/deps
            target/release/build
            target/release/.fingerprint
            target/release/examples
            target/wasm32-unknown-unknown/debug/deps
            target/wasm32-unknown-unknown/debug/build
            target/wasm32-unknown-unknown/debug/.fingerprint
            target/wasm32-wasip1/release/deps
            target/wasm32-wasip1/release/build
            target/wasm32-wasip1/release/.fingerprint
            target/wasm32-wasip1/release/examples
      - name: Node RAW decode
        run: nix develop -c cargo test -p looklab-raw --target wasm32-unknown-unknown --test wasm_node
      - name: Core crates build for wasm32
        run: nix develop -c cargo xtask wasm-core
      - name: Native/wasm bit identity
        run: nix develop -c cargo xtask bitid
      - uses: ./.github/actions/cache
        if: ${{ !cancelled() }}
        with:
          mode: save
          family: wasm-gates
          salt: node-wasm-core-bitid
          paths: |
            target/.rustc_info.json
            target/debug/deps
            target/debug/build
            target/debug/.fingerprint
            target/release/deps
            target/release/build
            target/release/.fingerprint
            target/release/examples
            target/wasm32-unknown-unknown/debug/deps
            target/wasm32-unknown-unknown/debug/build
            target/wasm32-unknown-unknown/debug/.fingerprint
            target/wasm32-wasip1/release/deps
            target/wasm32-wasip1/release/build
            target/wasm32-wasip1/release/.fingerprint
            target/wasm32-wasip1/release/examples

  trust_targeted:
    name: trust targeted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          fixtures: "false"
      - uses: ./.github/actions/cache
        with:
          mode: restore
          family: trust-release
          salt: release-targeted-harness
          paths: |
            target/.rustc_info.json
            target/release/deps
            target/release/build
            target/release/.fingerprint
      - name: Targeted trust policies
        run: nix develop -c cargo nextest run --locked -p looklab-trust --features harness --release --no-fail-fast --ignore-default-filter
      - name: Trust doctests
        if: ${{ !cancelled() }}
        run: nix develop -c cargo test --locked -p looklab-trust --features harness --release --doc
      - uses: ./.github/actions/cache
        if: ${{ !cancelled() }}
        with:
          mode: save
          family: trust-release
          salt: release-targeted-harness
          paths: |
            target/.rustc_info.json
            target/release/deps
            target/release/build
            target/release/.fingerprint

  ci:
    name: ci
    if: always()
    needs: [lint, native, wasm_release, trust_targeted]
    runs-on: ubuntu-latest
    steps:
      - name: Require every lane to succeed
        env:
          LINT: ${{ needs.lint.result }}
          NATIVE: ${{ needs.native.result }}
          WASM_RELEASE: ${{ needs.wasm_release.result }}
          TRUST_TARGETED: ${{ needs.trust_targeted.result }}
        run: |
          failed=0
          for lane in "lint=$LINT" "native=$NATIVE" "wasm release=$WASM_RELEASE" "trust targeted=$TRUST_TARGETED"; do
            result=${lane#*=}
            if [ "$result" != success ]; then
              echo "::error::${lane%%=*} lane result: $result"
              failed=1
            fi
          done
          exit "$failed"
