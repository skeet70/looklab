name: Pages

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"

jobs:
  setup_cache:
    name: setup cache (${{ matrix.role }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: lint
            fixtures: "false"
            family: lint
            salt: fmt-clippy-all-targets-check-web-wasm32
            paths: |
              target/.rustc_info.json
              target/debug/deps
              target/debug/build
              target/debug/.fingerprint
              target/wasm32-unknown-unknown/debug/deps
              target/wasm32-unknown-unknown/debug/build
              target/wasm32-unknown-unknown/debug/.fingerprint
          - role: native
            fixtures: "true"
            family: native-test
            salt: test-workspace-fit-synth
            paths: |
              target/.rustc_info.json
              target/debug/deps
              target/debug/build
              target/debug/.fingerprint
          - role: wasm
            fixtures: "true"
            family: wasm-gates
            salt: node-wasm-core-bitid
            paths: |
              target/.rustc_info.json
              target/debug/deps
              target/debug/build
              target/debug/.fingerprint
              target/release/deps
              target/release/build
              target/release/.fingerprint
              target/release/examples
              target/wasm32-unknown-unknown/debug/deps
              target/wasm32-unknown-unknown/debug/build
              target/wasm32-unknown-unknown/debug/.fingerprint
              target/wasm32-wasip1/release/deps
              target/wasm32-wasip1/release/build
              target/wasm32-wasip1/release/.fingerprint
              target/wasm32-wasip1/release/examples
          - role: trust-1
            fixtures: "false"
            family: trust-release
            salt: release-harness
            paths: |
              target/.rustc_info.json
              target/release/deps
              target/release/build
              target/release/.fingerprint
          - role: trust-2
            fixtures: "false"
            family: trust-release
            salt: release-harness
            paths: |
              target/.rustc_info.json
              target/release/deps
              target/release/build
              target/release/.fingerprint
          - role: trust-3
            fixtures: "false"
            family: trust-release
            salt: release-harness
            paths: |
              target/.rustc_info.json
              target/release/deps
              target/release/build
              target/release/.fingerprint
          - role: trust-4
            fixtures: "false"
            family: trust-release
            salt: release-harness
            paths: |
              target/.rustc_info.json
              target/release/deps
              target/release/build
              target/release/.fingerprint
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          fixtures: ${{ matrix.fixtures }}
      - uses: ./.github/actions/cache
        with:
          mode: restore
          family: ${{ matrix.family }}
          salt: ${{ matrix.salt }}
          paths: ${{ matrix.paths }}
      - name: Realize the project toolchain
        run: nix develop -c cargo --version
