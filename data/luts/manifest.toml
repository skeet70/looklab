# Community LUT donations. Every entry is CC0-1.0. `looklab admin import-lut`
# reads one entry, checks the cube bytes against `sha256` and stores the
# admission the worker's `lut_import` job publishes. The source bytes are never
# edited.

[donor]
handle = "mistycycles"
source = "community donation (Discord)"
date = "2026-11-05"
license = "CC0-1.0"
attribution = "mistycycles (Discord), donated 2026-11-05"

[donor_body]
body = "fujifilm/x-e3"
notes = "Metadata only. The X-E3 does not offer Eterna or Classic Negative."

[[lut]]
name = "Ricoh GRIV Cinema Green"
look = "ricoh-griv-cinema-green"
file = "Ricoh_GRIV_Cinema_Green_SRGB.cube"
title = "Ricoh_GRIV_Cinema_Green_v1 sRGB 33-grid - highlights -1/3 stop"
sha256 = "111d50be9209b064d0a7a48ee0b69077737f358b39111330c763be1caad09aab"
role = "original"
provenance = "AI-tool approximation of Ricoh GR stock Cinema (Green) image control, sRGB variant; not graded by a person. Donor revision v3 (2026-11-06) lowers the brightest near-neutral tones by 1/3 stop."
donor_body = "fujifilm/x-e3"
reason = "Community LUT donation round 2026-11: CC0 sRGB grade, admitted as a labelled approximate preview on the neutral baseline because the film simulation is not yet known."

[lut.emulates]
kind = "camera_rendering"
maker = "ricoh"
rendering = "Cinema (Green)"

[lut.encoding]
kind = "display"

[lut.encoding.base]
kind = "body_realization"
body = "fujifilm/x-e3"
renderer = "unspecified"
notes = "Fujifilm X-E3 RAW through an unnamed RAW converter."

[[lut]]
name = "Ricoh GRIV Cinema Green (F-Log2)"
look = "ricoh-griv-cinema-green-flog2"
file = "Ricoh_GRIV_Cinema_Green_FLog2.cube"
title = "Ricoh_GRIV_Cinema_Green_v1 F-Log2 input"
sha256 = "40b466dfcc1815581f7657b38730f20e8d70394fa0bf3a34d9dd5f291117d673"
role = "internal-test"
provenance = "AI-tool approximation of Ricoh GR stock Cinema (Green) image control, sRGB variant; not graded by a person. Converted to F-Log2/F-Gamut input by the same AI tool from the first sRGB revision, before the v3 highlight change."
reason = "Community LUT donation round 2026-11: CC0 internal-test F-Log2 conversion, admitted for preview and comparison."

[lut.emulates]
kind = "camera_rendering"
maker = "ricoh"
rendering = "Cinema (Green)"

[lut.encoding]
kind = "flog2_fgamut"

