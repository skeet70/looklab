# Documentation-derived record. Not a body snapshot, decoder mapping or fit input.
# Every value is not confirmed by camera owners.
catalog_version: 1
cameras:
- id: fujifilm/x100f
  make: Fujifilm
  model: X100F
  sources:
  - id: x100f-manual
    kind: owner_manual
    url: https://fujifilm-dsc.com/en/manual/x100f/
    title: FUJIFILM X100F Owner's Manual
    edition: BL00004857-206 EN
    firmware_scope: unspecified
  - id: x100f-firmware
    kind: firmware_notes
    url: https://fujifilm-x.com/en-us/support/download/firmware/cameras/x100f/
    title: X100F Firmware update
    edition: web edition, accessed 2026-11-08
    firmware_scope: '2.12'
  capabilities:
  - key: native_simulations
    label: FILM SIMULATION
    category: rendering
    availability: available
    domain:
      type: enum
      values:
      - PROVIA/STANDARD
      - Velvia/VIVID
      - ASTIA/SOFT
      - CLASSIC CHROME
      - PRO Neg. Hi
      - PRO Neg. Std
      - ACROS
      - ACROS+Ye
      - ACROS+R
      - ACROS+G
      - MONOCHROME
      - MONOCHROME+Ye
      - MONOCHROME+R
      - MONOCHROME+G
      - SEPIA
    citations:
    - source: x100f-manual
      locator: The Shooting Menu > FILM SIMULATION (menu_shooting/film_simulation)
    notes: ACROS and MONOCHROME are documented with yellow (Ye), red (R) and green (G) filter variants in a footnote.
  - key: jpeg_quality
    label: IMAGE QUALITY
    category: capture
    availability: available
    domain:
      type: enum
      values:
      - FINE
      - NORMAL
      - RAW
      - FINE+RAW
      - NORMAL+RAW
    citations:
    - source: x100f-manual
      locator: The Shooting Menu > IMAGE QUALITY (menu_shooting/image_quality)
  - key: raw_capture
    label: RAW RECORDING
    category: capture
    availability: available
    domain:
      type: enum
      values:
      - UNCOMPRESSED
      - LOSSLESS COMPRESSED
    citations:
    - source: x100f-manual
      locator: The Shooting Menu > RAW RECORDING (menu_shooting/raw_recording)
  - key: heif_capture
    label: HEIF
    category: capture
    availability: not_documented
    domain:
      type: unspecified
    citations:
    - source: x100f-manual
      locator: The Shooting Menu > IMAGE QUALITY (menu_shooting/image_quality)
    notes: No HEIF option appears in the documented image-quality formats.
  - key: in_camera_raw_conversion
    label: RAW CONVERSION
    category: workflow
    availability: available
    domain:
      type: boolean
    citations:
    - source: x100f-manual
      locator: The Playback Menu > RAW CONVERSION (menu_playback/raw_conversion)
  - key: jpeg_color_spaces
    label: COLOR SPACE
    category: capture
    availability: available
    domain:
      type: enum
      values:
      - sRGB
      - Adobe RGB
    citations:
    - source: x100f-manual
      locator: The Shooting Menu > COLOR SPACE (menu_shooting/color_space)
  - key: white_balance_presets
    label: WHITE BALANCE
    category: rendering
    availability: available
    domain:
      type: enum
      values:
      - AUTO
      - CUSTOM 1
      - CUSTOM 2
      - CUSTOM 3
      - COLOR TEMPERATURE
      - DAYLIGHT
      - SHADE
      - FLUORESCENT LIGHT-1
      - FLUORESCENT LIGHT-2
      - FLUORESCENT LIGHT-3
      - INCANDESCENT
      - UNDERWATER
    citations:
    - source: x100f-manual
      locator: The Shooting Menu > WHITE BALANCE (menu_shooting/white_balance)
  - key: white_balance_shift
    label: WB SHIFT
    category: rendering
    availability: available
    domain:
      type: axes
      axes:
      - label: R
      - label: B
    citations:
    - source: x100f-manual
      locator: The Shooting Menu > WHITE BALANCE (menu_shooting/white_balance) fine-tuning dialog
    notes: Two-axis fine-tuning dialog; the rendered dialog figure shows the grid and current R/B values without numeric limits.
  - key: dynamic_range
    label: DYNAMIC RANGE
    category: rendering
    availability: available
    domain:
      type: enum
      values:
      - AUTO
      - 100%
      - 200%
      - 400%
    citations:
    - source: x100f-manual
      locator: The Shooting Menu > DYNAMIC RANGE (menu_shooting/dynamic_range)
    notes: 200% requires ISO 400 or above; 400% requires ISO 800 or above. AUTO selects 100% or 200%.
  - key: highlight_tone
    label: HIGHLIGHT TONE
    category: rendering
    availability: available
    domain:
      type: integer
      min: -2
      max: 4
      step: 1
    citations:
    - source: x100f-manual
      locator: p. 91 (PDF 107), HIGHLIGHT TONE and SHADOW TONE
  - key: shadow_tone
    label: SHADOW TONE
    category: rendering
    availability: available
    domain:
      type: integer
      min: -2
      max: 4
      step: 1
    citations:
    - source: x100f-manual
      locator: p. 91 (PDF 107), HIGHLIGHT TONE and SHADOW TONE
  - key: saturation
    label: COLOR
    category: rendering
    availability: available
    domain:
      type: integer
      min: -4
      max: 4
      step: 1
    citations:
    - source: x100f-manual
      locator: p. 92 (PDF 108), COLOR, SHARPNESS, NOISE REDUCTION
  - key: sharpening
    label: SHARPNESS
    category: spatial
    availability: available
    domain:
      type: integer
      min: -4
      max: 4
      step: 1
    citations:
    - source: x100f-manual
      locator: p. 92 (PDF 108), COLOR, SHARPNESS, NOISE REDUCTION
  - key: noise_reduction
    label: NOISE REDUCTION
    category: spatial
    availability: available
    domain:
      type: integer
      min: -4
      max: 4
      step: 1
    citations:
    - source: x100f-manual
      locator: p. 92 (PDF 108), COLOR, SHARPNESS, NOISE REDUCTION
  - key: grain
    label: GRAIN EFFECT
    category: spatial
    availability: available
    domain:
      type: enum
      values:
      - STRONG
      - WEAK
      - 'OFF'
    citations:
    - source: x100f-manual
      locator: p. 91 (PDF 107), GRAIN EFFECT
  - key: film_simulation_bracket
    label: FILM SIMULATION BKT
    category: capture
    availability: available
    domain:
      type: boolean
    citations:
    - source: x100f-manual
      locator: Shooting menu list, FILM SIMULATION BKT (shooting/bracketing)
