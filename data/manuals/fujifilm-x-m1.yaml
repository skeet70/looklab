# Documentation-derived record. Not a body snapshot, decoder mapping or fit input.
# Every value is not confirmed by camera owners.
catalog_version: 1
cameras:
- id: fujifilm/x-m1
  make: Fujifilm
  model: X-M1
  sources:
  - id: xm1-manual
    kind: owner_manual
    url: https://dl.fujifilm-x.com/support/manual/x/fujifilm_xm1_manual_en.pdf
    title: FUJIFILM X-M1 Owner's Manual
    edition: BL03801-100 EN
    firmware_scope: unspecified
  - id: xm1-firmware
    kind: firmware_notes
    url: https://www.fujifilm-x.com/en-us/support/download/firmware/cameras/x-m1/
    title: X-M1 Firmware update
    edition: web edition, accessed 2026-11-10
    firmware_scope: '1.00-1.50'
  capabilities:
  - key: native_simulations
    label: FILM SIMULATION
    category: rendering
    availability: available
    domain:
      type: enum
      values:
      - PROVIA/STANDARD
      - Velvia/VIVID
      - ASTIA/SOFT
      - MONOCHROME
      - SEPIA
    citations:
    - source: xm1-manual
      locator: p. 61 (PDF 77), Film Simulation
    notes: The manual lists five options; Classic Chrome, Pro Neg., ACROS and monochrome filter variants are not documented.
  - key: jpeg_quality
    label: IMAGE QUALITY
    category: capture
    availability: available
    domain:
      type: enum
      values:
      - FINE
      - NORMAL
      - RAW
      - FINE+RAW
      - NORMAL+RAW
    citations:
    - source: xm1-manual
      locator: p. 71 (PDF 87), IMAGE QUALITY
  - key: raw_capture
    label: RAW RECORDING
    category: capture
    availability: available
    domain:
      type: boolean
    citations:
    - source: xm1-manual
      locator: p. 71 (PDF 87), IMAGE QUALITY
    notes: RAW, FINE+RAW and NORMAL+RAW are documented; no RAW compression option is.
  - key: heif_capture
    label: HEIF
    category: capture
    availability: not_documented
    domain:
      type: unspecified
    citations:
    - source: xm1-manual
      locator: p. 71 (PDF 87), IMAGE QUALITY
    notes: No HEIF option appears in the documented image-quality formats.
  - key: in_camera_raw_conversion
    label: RAW CONVERSION
    category: workflow
    availability: available
    domain:
      type: boolean
    citations:
    - source: xm1-manual
      locator: p. 63 (PDF 79), Creating JPEG Copies of RAW Pictures
  - key: jpeg_color_spaces
    label: COLOR SPACE
    category: capture
    availability: not_documented
    domain:
      type: unspecified
    citations:
    - source: xm1-manual
      locator: pp. 83-87 (PDF 99-103), Setup Menu Options
    notes: No COLOR SPACE option appears in the documented setup menu.
  - key: white_balance_presets
    label: WHITE BALANCE
    category: rendering
    availability: available
    domain:
      type: enum
      values:
      - AUTO
      - CUSTOM
      - DIRECT SUNLIGHT
      - SHADE
      - DAYLIGHT FLUORESCENT
      - WARM WHITE FLUORESCENT
      - COOL WHITE FLUORESCENT
      - INCANDESCENT
    citations:
    - source: xm1-manual
      locator: p. 45 (PDF 61), White Balance
    notes: The documented menu lists no color-temperature or underwater option.
  - key: white_balance_shift
    label: WB SHIFT
    category: rendering
    availability: available
    domain:
      type: axes
      axes:
      - label: R
      - label: B
    citations:
    - source: xm1-manual
      locator: p. 45 (PDF 61), WB SHIFT fine-tuning dialog
    notes: Two-axis fine-tuning dialog; the rendered dialog figure shows the grid and current R/B values without numeric limits.
  - key: dynamic_range
    label: DYNAMIC RANGE
    category: rendering
    availability: available
    domain:
      type: enum
      values:
      - AUTO
      - 100%
      - 200%
      - 400%
    citations:
    - source: xm1-manual
      locator: p. 71 (PDF 87), DYNAMIC RANGE
    notes: 200% requires ISO 400 or above; 400% requires ISO 800 or above.
  - key: highlight_tone
    label: HIGHLIGHT TONE
    category: rendering
    availability: available
    domain:
      type: unspecified
    citations:
    - source: xm1-manual
      locator: p. 71 (PDF 87), HIGHLIGHT TONE
    notes: Factory default 0 (STANDARD); no numeric range printed.
  - key: shadow_tone
    label: SHADOW TONE
    category: rendering
    availability: available
    domain:
      type: unspecified
    citations:
    - source: xm1-manual
      locator: p. 72 (PDF 88), SHADOW TONE
    notes: Factory default 0 (STANDARD); no numeric range printed.
  - key: saturation
    label: COLOR
    category: rendering
    availability: available
    domain:
      type: unspecified
    citations:
    - source: xm1-manual
      locator: p. 71 (PDF 87), COLOR
    notes: Factory default 0 (MID); no numeric range printed.
  - key: sharpening
    label: SHARPNESS
    category: spatial
    availability: available
    domain:
      type: unspecified
    citations:
    - source: xm1-manual
      locator: p. 71 (PDF 87), SHARPNESS
    notes: Factory default 0 (STANDARD); no numeric range printed.
  - key: noise_reduction
    label: NOISE REDUCTION
    category: spatial
    availability: available
    domain:
      type: unspecified
    citations:
    - source: xm1-manual
      locator: p. 72 (PDF 88), NOISE REDUCTION
    notes: Factory default 0 (STANDARD); no numeric range printed.
  - key: film_simulation_bracket
    label: FILM SIMULATION BKT
    category: capture
    availability: available
    domain:
      type: boolean
    citations:
    - source: xm1-manual
      locator: p. 60 (PDF 76), Bracketing
  notes:
  - The manual edition does not state a firmware version; the firmware notes start from 1.00 and list updates through 1.50 with no film-simulation or rendering-control addition.
  - Documentation-derived only; no owner confirmation is recorded.
