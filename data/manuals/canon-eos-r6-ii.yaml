  notes:
  - User Def. 1-3 register a base Picture Style plus adjustments; a style not yet customized behaves as [Auto] (p. 255, 261).
  - The Monochrome Picture Style exposes Filter effect (N/Ye/Or/R/G) and a separate Toning effect whose colours the guide does not enumerate, so `monochrome_toning` is unspecified; Picture Style also exposes Color tone (-4 reddish to +4 yellowish) (p. 259-260).
  - For movie recording, [Fineness] and [Threshold] under Sharpness cannot be set (p. 259); the guide gives Strength 0-7, Fineness 1-5 and Threshold 1-5.
  - 'Monochrome: colour images cannot be recovered from JPEG/HEIF images shot with [Monochrome] (p. 254).'
  - HEIF is selectable only when [HDR PQ settings] HDR shooting is set to [Enable] (p. 170).
  - Auto White Balance offers Ambience priority and White priority; Ambience priority keeps a slightly warm cast under tungsten lighting (p. 241).
  - WB correction is a B/A and M/G grid with no numeric extent stated; one B/A level equals approx. 5 mireds, and B/A bracketing bias is ±3 levels (p. 249-250).
  - 'Auto Lighting Optimizer: the option screen shows four positions with the first labelled OFF, while the guide''s text names only Disable, Low and Standard (p. 202).'
  - Highlight tone priority is forced to [Enable] when [HDR shooting] is enabled, and set to [Disable] when [HDR Mode shoot.] is set to an option other than [Off] (p. 205).
  - Exposure compensation of ±3 stops in 1/3-stop increments is stated in the movie Other Menu Functions (p. 448); the still-photo AEB section states up to ±3 stops in 1/3-stop increments (p. 180) and gives no separate stills compensation range.
  - RAW bit depth is not stated in the guide.
  - 'JPEG/HEIF quality: L, M and S1 each in a standard and a fine variant, S2 in fine only (p. 169); the guide names only the fine level as ''(Fine)'' (p. 170).'
  - Clarity is a separate menu item rather than a Picture Style parameter (p. 264); its -4 to +4 range appears in the RAW processing options list (p. 651).
  - Shooting creative filters save only the filtered image, force single shooting regardless of drive mode, and offer different effects for movie recording (p. 265, 267).
  - Multi Shot Noise Reduction is unavailable with RAW or RAW+JPEG, and the camera switches to [Standard] when RAW or RAW+JPEG is set (p. 280).
