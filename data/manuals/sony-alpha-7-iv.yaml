  notes:
  - 'Creative Look prints long names for each Look: ST(Standard), PT(Portrait), NT(Neutral), VV(Vivid), VV2(Vivid 2), FL(Film), IN(Instant), SH(Soft Highkey), BW(Black & White), SE(Sepia) (pp. 218-219).'
  - Custom Look registers six numbered slots that recall the same Looks with different settings; slot count is six (p. 219).
  - Creative Look is fixed to [-] when [Intelligent Auto] is selected or [Picture Profile] is set to other than [Off] (p. 220).
  - Creative Look also exposes Fade (0 to 9) and Sharpness Range (1 to 5), which have no registry key; Sharpness Range cannot be adjusted in movie mode (pp. 219-220).
  - 'No Creative Style menu exists on this body: the Color/Tone menu group enumerates D-Range Optimizer, Creative Look, Picture Profile and Soft Skin Effect only (p. 113).'
  - White Balance also offers C.Temp./Filter (color temperature with color filter effect) and three Custom registers; the manual states no Kelvin range (pp. 212-214).
  - White Balance fine adjustment is reached from the right side of the control wheel and uses a color-tone grid; the manual states no numeric limit for the shift amount (p. 212).
  - D-Range Optimizer is fixed to [Off] when [Picture Profile] is set to other than [Off] (p. 200).
  - The manual documents no Auto HDR item; D-Range Optimizer is the only dynamic-range control documented (p. 200).
  - When [HLG Still Image] is [On], both [Creative Look] and [D-Range Optimizer] are not available (p. 255).
  - 'HEIF recording has no Color Space selection: with [HLG Still Image] Off the file is sRGB, with it On the file is recorded in BT.2100 (BT.2020 color gamut) (pp. 246, 257).'
  - JPEG/HEIF Switch options are JPEG, HEIF(4:2:0), HEIF(4:2:2) (p. 246); the File Format menu switches between JPEG and HEIF accordingly (p. 247).
  - RAW is 14 bits per pixel, limited to 12 bits for [Cont. Shooting] when [RAW File Type] is [Compressed] (p. 247).
  - Lossless Comp (L/M/S) under [RAW File Type] requires camera firmware Ver.1.10 or later (p. 249); creating still images from Shot Marks requires Ver.4.00 or later (p. 418). The document does not otherwise state the firmware it describes.
  - High ISO NR is fixed to [Normal] in [Intelligent Auto], is not available when [File Format] is [RAW], and does not affect RAW data when [File Format] is [RAW & JPEG]/[RAW & HEIF] (p. 318).
  - Exposure step is selectable between 0.5EV and 0.3EV, default 0.3EV (pp. 198, 560); the movie exposure compensation range is -2.0 EV to +2.0 EV (p. 196).
  - Exposure compensation cannot be set in [Intelligent Auto], and under [Manual Exposure] only when [ISO] is [ISO AUTO] (p. 196).
  - The Playback Edit group on p. 116 lists Photo Capture, Create Still Image and JPEG/HEIF Switch and does not list RAW conversion; the manual states RAW images are opened and converted with Imaging Edge Desktop (p. 247).
