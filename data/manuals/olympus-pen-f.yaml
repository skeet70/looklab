  notes:
  - Color Creator, Color Profile Control, Monochrome Profile Control, and Art Filter are creative-dial image enhancement modes, not Picture mode options (p. 38). Color Profile Control adjusts twelve colors by up to ±5, with hue on the front dial and saturation on the rear dial, stored in Color Profile 1-3 (p. 39); Monochrome Profile Control sets a color filter and filter level plus a Shading Editor (p. 40). The exposure compensation dial covers ±3.0 EV; ±5 EV requires assigning exposure compensation to the front or rear dial (p. 45). Firmware version 3.0 adds Bleach Bypass and Shading Editor for Color Profile Control and Color Creator (p. 179).
