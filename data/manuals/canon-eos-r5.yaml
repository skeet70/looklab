  notes:
  - User Def. 1-3 register a base Picture Style plus adjustments; a User Def. style not yet registered behaves as [Standard] (p. 200, 206).
  - The Monochrome Picture Style exposes Filter effect (N/Ye/Or/R/G) and a separate Toning effect whose colours the guide does not enumerate, so `monochrome_toning` is unspecified; Picture Style also exposes Color tone (-4 reddish to +4 yellowish) (p. 204-205).
  - For movie recording, [Fineness] and [Threshold] under Sharpness cannot be set (p. 204); the guide gives Strength 0-7, Fineness 1-5 and Threshold 1-5.
  - 'Monochrome: colour images cannot be recovered from JPEG images shot with [Monochrome] (p. 199).'
  - HEIF is selectable only when [HDR PQ settings] HDR shooting is set to [Enable] (p. 137).
  - Auto White Balance offers Ambience priority and White priority; with White priority the warm cast may fade and flash follows Ambience behaviour (p. 186-187).
  - WB correction is a B/A and M/G grid with no numeric extent stated; one B/A level equals approx. 5 mireds, and B/A bracketing bias is ±3 levels (p. 194-195).
  - 'Auto Lighting Optimizer: the option screen shows four positions with the first labelled OFF, while the guide''s text names only Disable, Low and Standard (p. 161).'
  - Exposure compensation of ±3 stops in 1/3-stop increments is stated in the movie Other Menu Functions (p. 369); the still-photo AEB section states up to ±3 stops in 1/3-stop increments (p. 147) and gives no separate stills compensation range.
  - RAW bit depth is not stated in the guide.
  - 'JPEG/HEIF quality: L, M and S1 each in a standard and a fine variant, S2 in fine only (p. 136); the guide names only the fine level as ''(Fine)'' (p. 137).'
  - Clarity is a separate menu item rather than a Picture Style parameter (p. 209); its -4 to +4 range appears in the RAW processing options list (p. 546).
