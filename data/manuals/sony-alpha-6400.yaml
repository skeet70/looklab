  notes:
  - Style Box holds six registration slots ([Style Box] 1-6), each storing a Creative Style preset with its own Contrast/Saturation/Sharpness values (p. 205).
  - '[Creative Style] is fixed to [Standard] under [Intelligent Auto], [Superior Auto], [Scene Selection], when [Picture Effect] is other than [Off], and when [Picture Profile] is other than [Off] (p. 205).'
  - Contrast, Saturation and Sharpness are adjusted per style, but the manual states no numeric range or default for them (p. 205).
  - '[Saturation] cannot be adjusted when the style is [Black & White] or [Sepia] (p. 205); the manual documents no separate toning or filter parameter, only those two fixed styles (p. 205).'
  - '[Auto HDR] sits in the same [DRO/Auto HDR] menu but is a three-exposure composite (Exposure Diff. Auto or 1.0EV-6.0EV) and is not part of the D-Range Optimizer option list; it is unavailable when [File Format] is [RAW] or [RAW & JPEG] (p. 188).'
  - '[High ISO NR] is unavailable when [File Format] is [RAW] and has no effect on RAW images when [File Format] is [RAW & JPEG] (p. 219).'
  - '[Picture Effect] (p. 207, recorded here as creative_filters) and [Picture Profile] (p. 247) are separate menu items, not Creative Style presets.'
  - The White Balance fine adjustment grid exists (right side of the control wheel) but the manual states no numeric range for it; [C.Temp./Filter] is likewise documented without a Kelvin range (p. 200).
  - The playback menu enumeration lists Photo Capture, Enlarge, Rotate, Copy and the viewing functions and does not list an in-camera RAW conversion; the manual's only stated RAW development path is the Imaging Edge computer application (p. 13, Using a computer > Developing RAW images/Remote shooting (Imaging Edge); p. 389, Imaging Edge).
  - '[White Balance] is fixed to [Auto] under [Intelligent Auto], [Superior Auto] and [Scene Selection] (p. 200).'
  - RAW images are recorded in compressed RAW only (no RAW File Type option) at 14 bits per pixel, reduced to 12 bits with [Long Exposure NR], [BULB], [Cont. Shooting] (including [Superior Auto] continuous shooting) or [Silent Shooting] (p. 144).
  - The File Format menu on p. 144 lists RAW, RAW & JPEG and JPEG; HEIF is not listed.
  - Exposure compensation range is -5.0 EV to +5.0 EV; movies are limited to -2.0 EV to +2.0 EV (p. 173-174).
  - '[Exposure step] is selectable between 0.3EV and 0.5EV (p. 177).'
  - The a6400 manual has no list of default setting values, so no documented defaults are recorded for this body.
