  notes:
  - Movie-only picture modes [a1 Flat], [a2 OM-Log400], and [a3 HLG] are selected via [nPicture Mode] and are not stills Picture Mode values (p. 149); [a3 HLG] cannot be selected when [nVideo Codec] is set to [H.264]. Movie exposure compensation is limited to ±3.0 EV (p. 106). [AdobeRGB] is not available in HDR or movie mode or when an art filter is selected for picture mode (p. 155).
