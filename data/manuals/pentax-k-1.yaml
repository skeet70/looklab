  notes:
  - In R (Scene Analyze Auto) mode the finishing tone is fixed to [Auto Select], and the white balance is fixed to [Auto White Balance] (p. 66, p. 63, p. 44).
  - Cross Processing output varies each time a picture is taken; its parameter offers Random, Preset 1-3 and Favorite 1-3, and up to three captured settings can be saved as Favorites (p. 67, p. 117).
  - Digital Filter cannot be used in combination with some other functions (p. 67, p. 107).
  - Clarity is a separate A3 menu item, not a Custom Image parameter, adjustable in the range -4 to +4 (p. 70, p. 117).
  - The manual names only Saturation, Contrast, Highlight Adjustment, Shadow Adjustment, Sharpness, Fine Sharpness and Extra Sharpness as Custom Image parameters and states no numeric ranges for them; Hue, High/Low Key Adjustment, Toning and Filter Effect are not described (p. 66).
  - White Balance fine-tuning is ±7 steps on the A-B and G-M axes (p. 116).
  - No dedicated Flash white balance preset exists; [17 WB When Using Flash] in the E3 menu selects Auto White Balance, Multi Auto White Balance or Unchanged (p. 63).
  - Color Temperature is settable from 2,500K to 10,000K; Q changes it in 100 K steps and R in 1,000 K steps, or in 20 and 100 mired steps when [18 Color Temperature Steps] is set to Mired (p. 64).
  - Exposure compensation is -2 to +2 EV in C mode, and the step can be switched between 1/3 EV and 1/2 EV in [1 EV Steps] (p. 46, p. 116).
  - '[Highlight Correction] cannot be set to [ON] below ISO 200 and is limited to [AUTO] or [OFF] in C mode; the manual names [ON], [AUTO] and [OFF] for [Highlight Correction] and shows both correction items defaulting to [Auto], without enumerating the option set of [Shadow Correction] (p. 68, p. 23).'
  - HDR Capture merges three exposures at different levels into one image and is not available in M, N or C mode (p. 68).
  - Skin Tone (Type1, Type2) is a separate A3 menu control with no registry key (p. 70).
  - The File Format menu on p. 43 lists JPEG, RAW and RAW+; HEIF is not listed. RAW File Format offers PEF and DNG.
