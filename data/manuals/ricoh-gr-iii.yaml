  notes:
  - Image Control is not applied to RAW images; it can be applied during [RAW Development] of the C2 menu (p. 88, p. 100).
  - '[Soft Monotone] and [HDR Tone] cannot be selected in movie mode; the movie Image Control list omits both (p. 88, p. 31).'
  - Image Control provides two registrable settings, Custom1 and Custom2 (p. 87).
  - Image Control also exposes Hue, High/Low Key Adjustment, Shading, Filter Effect and HDR Tone Level (p. 148); no registry key exists for them and the manual states no numeric ranges for any Image Control parameter.
  - Toning is listed as an Image Control parameter (p. 148) but the manual does not enumerate its option labels.
  - White Balance has no dedicated Flash preset; with flash the manual requires Auto White Balance, Multi Auto White Balance or Manual White Balance (p. 71).
  - White Balance fine adjustment is ±14 steps on the A-B and G-M axes (p. 148).
  - Color Temperature is settable from 2500 to 10000 K in increments of 10 K (p. 73).
  - Exposure compensation is ±2.0 EV in movie mode (p. 53, p. 148).
  - '[D-Range Correction] has two independent sub-controls, [Highlight Correction] and [Shadow Correction]; the enum values carry the sub-control name (p. 89).'
  - '[Highlight Correction] has no effect below ISO 200; [Shadow Correction] set to [High] may make noise noticeable (p. 89).'
  - The File Format menu on p. 84 lists JPEG, RAW (DNG) and RAW+JPEG; HEIF is not listed.
  - No JPEG quality option is documented; JPEG Recorded Pixels offers L, M, S and XS (p. 84).
