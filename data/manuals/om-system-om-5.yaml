  notes:
  - Exposure compensation is limited to ±3.0 EV during movie recording (p. 89). The manual lists the white balance presets by letter designator with light-source descriptions and does not give preset names (p. 130). Sharpness, Contrast, Saturation, and Noise Filter are documented as adjustable but with no enumerated range or levels in the text (p. 158, p. 285). [AdobeRGB] is not available in AUTO, SCN, ART, HDR, or movie mode (p. 165).
