  notes:
  - Picture Control values change in increments of 1, or in increments of 0.25 when the sub-command dial is rotated; the manual prints no numeric range for [Sharpening], [Clarity], [Contrast], [Saturation], or [Hue] (p. 177).
  - '[Quick sharp] adjusts [Sharpening], [Mid-range sharpening], and [Clarity] together as one control; [Mid-range sharpening] covers contrast areas larger than [Sharpening] and smaller than [Clarity] and has no registry key (p. 178).'
  - The photo/video selector's B&W position restricts [Set Picture Control] to [Monochrome], [Flat Monochrome], and [Deep Tone Monochrome] (p. 175).
  - With [HLG] selected for [Tone mode], Picture Controls are limited to [Standard], [Monochrome], and [Flat] and are chosen with the separate [Set Picture Control (HLG)] item (pp. 396, 844).
  - '[Brightness] is unavailable with [Auto] and Creative Picture Controls; [Saturation] is unavailable with the three monochrome Picture Controls and certain Creative Picture Controls; [Hue] is unavailable with [Auto], the three monochrome Picture Controls, and certain Creative Picture Controls (p. 178).'
  - '[Brightness] and [Hue] have no registry keys; [Effect level] is displayed only for Creative Picture Controls (p. 178).'
  - '[Filter effects] offers [OFF], [Y] (yellow), [O] (orange), [R] (red), and [G] (green); [Deep Tone Monochrome] applies a built-in red filter effect that an [OFF] setting leaves in place (p. 180).'
  - '[Toning] offers 9 tints, described as including cyanotype and old-fashioned sepia; the full list is not printed, and pressing 3 with any option other than [B&W] displays saturation options (p. 179).'
  - Custom Picture Controls are stored in slots C-1 through C-9 (p. 182).
  - White balance can be fine-tuned up to six steps from the centre on each of the A-B and G-M axes (p. 161).
  - '[Choose color temperature] spans 2500-10000 K (p. 158); the manual states no increment, so `step` is omitted.'
  - '[Auto] white balance offers the sub-options [Keep white (reduce warm colors)], [Keep overall atmosphere], and [Keep warm lighting colors]; [Fluorescent] offers [Cool-white fluorescent], [Day white fluorescent], and [Daylight fluorescent]; the default is [Auto-Keep overall atmosphere] (pp. 157-158, 371).'
  - The exposure compensation dial itself covers -3 to +3 EV in 1/3 EV steps; -5 to +5 EV requires the dial set to C, adjusted with the command dials, i menu, touch controls, or custom controls (pp. 143-144).
  - Active D-Lighting offers [Auto], [Extra high], [High], [Normal], [Low], and [Off]; in mode M [Auto] is equivalent to [Normal] (pp. 401-402).
  - NEF (RAW) is recorded at 14 bits; the [RAW recording] menu offers only [Lossless compression], [High efficiency] and [High efficiency] with a star (p. 391).
  - The [Auto] Picture Control is adjustable from [A-2] to [A+2]; individual settings offer an [A] (auto) value (p. 180).
  - '[Set Picture Control] is also available for videos, with a [Same as photo settings] option (p. 176).'
  - JPEG and HEIF quality options also exist in star-marked variants that maximize image quality; the default image quality is [JPEG/HEIF normal] (pp. 110, 371).
