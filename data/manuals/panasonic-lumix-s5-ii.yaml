  notes:
  - My Photo Style has 10 slots ([MY PHOTO STYLE 1] to [MY PHOTO STYLE 10]); effects up to [MY PHOTO STYLE 4] are displayed with default settings and the registered name may be up to 22 characters (p. 304, p. 313).
  - '[LEICA Monochrome] is documented only in the firmware Ver. 3.1 addendum (p. F-71, listed at p. F-85); the base Photo Style list at pp. 301-304 does not include it.'
  - Photo Style is not available while [Filter Settings] is in use (p. 305); in [iA] mode only [Standard] or [Monochrome] can be set and image quality cannot be adjusted (p. 305).
  - '[Like2100(HLG)] and [Like2100(HLG) Full Range] can only be selected in the video mode with a 10-bit [Rec Quality] (p. 304).'
  - 'Per the p. 309 table: Contrast, Highlight, Shadow and Sharpness are adjustable for all Photo Styles except the V-Log and REAL TIME LUT groups; Color Tone and Filter Effect only for the Monochrome/L.Monochrome/L.Monochrome D/L.Monochrome S group; Hue not for the monochrome group; Grain Effect and Color Noise only for L.ClassicNeo and the monochrome group; Noise Reduction adjustable for all listed groups.'
  - '[Grain Effect] and [Color Noise] are not available during video recording (p. 310).'
  - Photo Style [Color Tone] (blue/yellow tint), [Hue] (violet/magenta to yellow/green) and [Filter Effect] (Yellow/Orange/Red/Green/Off, monochrome group only) are documented at pp. 306-307 but have no registry key.
  - '[Filter Settings] is a separate control from the Photo Style [Filter Effect]; while it is used the white balance is fixed to [AWB], the flash is fixed to Forced Flash Off and the ISO upper limit is [6400] (pp. 305, 316, 318).'
  - White balance fine adjustment uses [A]/[G]/[B]/[M] axes with diagonal and touch operation; the manual does not state the numeric adjustment limits (p. 299).
  - The white balance [Flash] setting operates as [AWB] during video recording (p. 295).
  - Exposure compensation is 1/3 EV steps over ±5 EV; the range changes to ±3 EV when recording videos (p. 280).
  - Color temperature is settable from 2500 K to 10000 K (p. 298); the manual states no increment, so `step` is omitted.
  - The p. 306 adjustment scale shown for Photo Style image quality items runs from -5 to +5 with 0 at centre; the manual gives no separate numeric range for individual items.
  - '[i.Dynamic Range] is not available with [Like709]/[V-Log]/[REAL TIME LUT]/[Like2100(HLG)]/[Like2100(HLG) Full Range] Photo Styles or with [Filter Settings] (p. 283).'
  - RAW images are 14 bits, limited to 12 bits during burst recording; RAW images are always recorded in [L] size at [3:2] (p. 120).
  - '[Color Space] is fixed to [sRGB] during video recording, with [Like709]/[V-Log]/[REAL TIME LUT] Photo Styles, and with [Filter Settings] (p. 538).'
  - '[RAW Processing] processes RAW images on the camera and saves them as JPEG; [REAL TIME LUT] cannot be selected as a Photo Style in RAW Processing (pp. 482, 485).'
  - Picture Quality is not available in High Resolution mode (p. 120).
  - The [Picture Quality] menu on p. 120 lists [FINE], [STD.], [RAW+FINE], [RAW+STD.] and [RAW]; HEIF is not listed, and the manual does not state that HEIF is unsupported.
