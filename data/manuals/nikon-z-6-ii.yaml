  notes:
  - The [Image quality] menu on p. 152 lists NEF (RAW), NEF (RAW) + JPEG and JPEG options; HEIF is not listed.
  - Picture Control values change in increments of 1, or in increments of 0.25 when the sub-command dial is rotated; the manual prints no numeric range for [Sharpening], [Clarity], [Contrast], [Saturation], or [Hue] (p. 141).
  - '[Quick sharp] adjusts [Sharpening], [Mid-range sharpening], and [Clarity] together as one control; [Mid-range sharpening] covers patterns and lines between the range of [Sharpening] and [Clarity] and has no registry key (p. 143).'
  - In movie recording the [Mid-range sharpening] value applies only to footage recorded at [3840x2160; 60p], [3840x2160; 50p], or [High quality] (p. 144).
  - The [n Auto] Picture Control is adjustable from [A-2] to [A+2]; individual settings offer an [A] (auto) value (pp. 142-143).
  - '[Effect level] is displayed only for Creative Picture Controls and has no registry key (p. 143).'
  - '[Brightness] (raise or lower brightness without loss of highlight or shadow detail) and [Hue] have no registry keys (p. 143).'
  - '[Filter effects] offers [Y] (yellow), [O] (orange), [R] (red), and [G] (green) for monochrome pictures (p. 144); the [Toning] tint list is not printed, and pressing 3 with any option other than [B&W] displays saturation options (p. 143).'
  - Custom Picture Controls are stored in slots C-1 through C-9 (pp. 278-281).
  - White balance can be fine-tuned up to six steps from the centre on each of the A-B and G-M axes, in increments of 0.5 (A-B) and 0.25 (G-M) (p. 268).
  - '[Choose color temperature] spans 2500-10000 K (p. 97); the manual states no increment, so `step` is omitted.'
  - Exposure increments default to 1/3 EV and can be changed to 1/2 EV with Custom Setting b1 [EV steps for exposure cntrl] (p. 122).
  - '[Auto] white balance offers the sub-options [Keep white (reduce warm colors)], [Keep overall atmosphere], and [Keep warm lighting colors]; [Fluorescent] offers seven bulb types; the default is [Auto] with [Keep overall atmosphere] (pp. 95-96, 214).'
  - Active D-Lighting offers [Auto], [Extra high], [High], [Normal], [Low], and [Off]; in mode M [Auto] is equivalent to [Normal] (pp. 283-284).
  - JPEG quality options also exist in star-marked variants that maximize image quality (p. 152).
  - Exposure compensation is limited to -3 to +3 EV in movie mode (p. 122).
  - Set Picture Control is also available for movies, with a [Same as photo settings] option (p. 367).
