# Documentation-derived record. Not a body snapshot, decoder mapping or fit input.
# Every value is not confirmed by camera owners.
catalog_version: 1
cameras:
- id: fujifilm/x-h2s
  make: Fujifilm
  model: X-H2S
  sources:
  - id: fuji-x-h2s-manual
    kind: owner_manual
    url: https://fujifilm-dsc.com/en/manual/x-h2s/
    title: FUJIFILM X-H2S Owner’s Manual
    edition: FF210002 (document code; the online manual states no firmware version)
    firmware_scope: unspecified
  - id: fuji-x-h2s-firmware
    kind: firmware_notes
    url: https://www.fujifilm-x.com/en-us/support/download/firmware/cameras/x-h2s/
    title: X-H2S Firmware update
    edition: firmware notes page, last updated 12.02.2025
    firmware_scope: latest listed Ver.7.30
  capabilities:
  - key: native_simulations
    label: FILM SIMULATION
    category: rendering
    availability: available
    domain:
      type: enum
      values:
      - PROVIA/STANDARD
      - Velvia/VIVID
      - ASTIA/SOFT
      - CLASSIC CHROME
      - REALA ACE
      - PRO Neg. Hi
      - PRO Neg. Std
      - CLASSIC Neg.
      - NOSTALGIC Neg.
      - ETERNA/CINEMA
      - ETERNA BLEACH BYPASS
      - ACROS
      - ACROS+Ye FILTER
      - ACROS+R FILTER
      - ACROS+G FILTER
      - MONOCHROME
      - MONOCHROME+Ye FILTER
      - MONOCHROME+R FILTER
      - MONOCHROME+G FILTER
      - SEPIA
    citations:
    - source: fuji-x-h2s-manual
      locator: IMAGE QUALITY SETTING > FILM SIMULATION
    - source: fuji-x-h2s-firmware
      locator: Ver.7.00 entry
    notes: REALA ACE added by firmware Ver.7.00; the online manual also lists it.
  - key: white_balance_presets
    label: WHITE BALANCE
    category: rendering
    availability: available
    domain:
      type: enum
      values:
      - WHITE PRIORITY
      - AUTO
      - AMBIENCE PRIORITY
      - CUSTOM 1
      - CUSTOM 2
      - CUSTOM 3
      - COLOR TEMPERATURE
      - DAYLIGHT
      - SHADE
      - FLUORESCENT LIGHT-1
      - FLUORESCENT LIGHT-2
      - FLUORESCENT LIGHT-3
      - INCANDESCENT
      - UNDERWATER
    citations:
    - source: fuji-x-h2s-manual
      locator: IMAGE QUALITY SETTING > WHITE BALANCE
  - key: white_balance_shift
    label: WHITE BALANCE (fine-tuning)
    category: rendering
    availability: available
    domain:
      type: axes
      axes:
      - label: R
        min: -9
        max: 9
        step: 1
      - label: B
        min: -9
        max: 9
        step: 1
    citations:
    - source: fuji-x-h2s-manual
      locator: IMAGE QUALITY SETTING > WHITE BALANCE > Fine-Tuning White Balance (figure osd_mn_sm_wb_shift_x-h2s_en.png)
    notes: Two-axis R/B fine-tuning with a numeric readout; the dialog figure shows a 19-position grid per axis, i.e. -9 to +9 in steps of 1.
  - key: color_temperature
    label: WHITE BALANCE > COLOR TEMPERATURE
    category: rendering
    availability: available
    domain:
      type: integer
      min: 2500
      max: 10000
      step: 10
    citations:
    - source: fuji-x-h2s-manual
      locator: IMAGE QUALITY SETTING > WHITE BALANCE > COLOR TEMPERATURE
    notes: Kelvin; also adjustable in 10 K increments with the rear command dial.
  - key: exposure_compensation
    label: EXPOSURE COMPENSATION
    category: rendering
    availability: available
    domain:
      type: rational
      min: '-5'
      max: '+5'
      step: 1/3
    citations:
    - source: fuji-x-h2s-manual
      locator: Specifications > Exposure compensation
    - source: fuji-x-h2s-manual
      locator: Exposure Compensation
    notes: Still pictures -5 to +5 EV in 1/3 EV increments, movies -2 to +2 EV, per the Specifications page; the exposure page states the amount available varies with the shooting mode. No dedicated exposure-compensation dial.
  - key: dynamic_range
    label: DYNAMIC RANGE
    category: rendering
    availability: available
    domain:
      type: enum
      values:
      - AUTO
      - 100%
      - 200%
      - 400%
    citations:
    - source: fuji-x-h2s-manual
      locator: IMAGE QUALITY SETTING > DYNAMIC RANGE
    notes: 200% requires ISO 320-12800; 400% requires ISO 640-12800. AUTO selects 100% or 200%.
  - key: dynamic_range_priority
    label: D RANGE PRIORITY
    category: rendering
    availability: available
    domain:
      type: enum
      values:
      - AUTO
      - STRONG
      - WEAK
      - 'OFF'
    citations:
    - source: fuji-x-h2s-manual
      locator: IMAGE QUALITY SETTING > D RANGE PRIORITY
    notes: WEAK requires ISO 320-12800; STRONG requires ISO 640-12800. Any setting other than OFF overrides TONE CURVE and DYNAMIC RANGE.
  - key: highlight_tone
    label: TONE CURVE > HIGHLIGHTS
    category: rendering
    availability: available
    domain:
      type: integer
      min: -2
      max: 4
      step: 1
    citations:
    - source: fuji-x-h2s-manual
      locator: IMAGE QUALITY SETTING > TONE CURVE
    notes: Set through the TONE CURVE item.
  - key: shadow_tone
    label: TONE CURVE > SHADOWS
    category: rendering
    availability: available
    domain:
      type: integer
      min: -2
      max: 4
      step: 1
    citations:
    - source: fuji-x-h2s-manual
      locator: IMAGE QUALITY SETTING > TONE CURVE
    notes: Set through the TONE CURVE item.
  - key: saturation
    label: COLOR
    category: rendering
    availability: available
    domain:
      type: integer
      min: -4
      max: 4
      step: 1
    citations:
    - source: fuji-x-h2s-manual
      locator: IMAGE QUALITY SETTING > COLOR
  - key: monochrome_toning
    label: MONOCHROMATIC COLOR
    category: rendering
    availability: available
    domain:
      type: axes
      axes:
      - label: WC
        min: -18
        max: 18
        step: 1
      - label: MG
        min: -18
        max: 18
        step: 1
    citations:
    - source: fuji-x-h2s-manual
      locator: IMAGE QUALITY SETTING > MONOCHROMATIC COLOR (figure osd_mn_sm_mono_color_x-h2s_en.png)
    notes: Two-axis WC/MG adjustment with a numeric readout; the dialog figure shows a 37-position grid per axis, i.e. -18 to +18 in steps of 1.
  - key: creative_filters
    label: ADVANCED FILTERS
    category: mixed
    availability: not_documented
    domain:
      type: unspecified
    notes: The manual has no advanced-filter or filter-setting page for this model.
  - key: sharpening
    label: SHARPNESS
    category: spatial
    availability: available
    domain:
      type: integer
      min: -4
      max: 4
      step: 1
    citations:
    - source: fuji-x-h2s-manual
      locator: IMAGE QUALITY SETTING > SHARPNESS
  - key: noise_reduction
    label: HIGH ISO NR
    category: spatial
    availability: available
    domain:
      type: integer
      min: -4
      max: 4
      step: 1
    citations:
    - source: fuji-x-h2s-manual
      locator: IMAGE QUALITY SETTING > HIGH ISO NR
  - key: clarity
    label: CLARITY
    category: spatial
    availability: available
    domain:
      type: integer
      min: -5
      max: 5
      step: 1
    citations:
    - source: fuji-x-h2s-manual
      locator: IMAGE QUALITY SETTING > CLARITY
    notes: Additional processing at settings other than 0 increases save time.
  - key: grain
    label: GRAIN EFFECT (ROUGHNESS)
    category: spatial
    availability: available
    domain:
      type: enum
      values:
      - STRONG
      - WEAK
      - 'OFF'
    citations:
    - source: fuji-x-h2s-manual
      locator: IMAGE QUALITY SETTING > GRAIN EFFECT > ROUGHNESS
  - key: grain_size
    label: GRAIN EFFECT (SIZE)
    category: spatial
    availability: available
    domain:
      type: enum
      values:
      - LARGE
      - SMALL
    citations:
    - source: fuji-x-h2s-manual
      locator: IMAGE QUALITY SETTING > GRAIN EFFECT > SIZE
  - key: color_chrome_effect
    label: COLOR CHROME EFFECT
    category: unknown
    availability: available
    domain:
      type: enum
      values:
      - STRONG
      - WEAK
      - 'OFF'
    citations:
    - source: fuji-x-h2s-manual
      locator: IMAGE QUALITY SETTING > COLOR CHROME EFFECT
    notes: Affects the rendering of highly saturated colours such as reds, yellows and greens.
  - key: color_chrome_fx_blue
    label: COLOR CHROME FX BLUE
    category: unknown
    availability: available
    domain:
      type: enum
      values:
      - STRONG
      - WEAK
      - 'OFF'
    citations:
    - source: fuji-x-h2s-manual
      locator: IMAGE QUALITY SETTING > COLOR CHROME FX BLUE
    notes: Affects the rendering of blues.
  - key: smooth_skin_effect
    label: SMOOTH SKIN EFFECT
    category: spatial
    availability: not_documented
    domain:
      type: unspecified
    notes: The X-H2S IMAGE QUALITY SETTING menu page lists no SMOOTH SKIN EFFECT item, and the playback-menu RAW CONVERSION list has no SMOOTH SKIN EFFECT entry.
  - key: raw_capture
    label: RAW
    category: capture
    availability: available
    domain:
      type: boolean
    citations:
    - source: fuji-x-h2s-manual
      locator: IMAGE QUALITY SETTING > IMAGE QUALITY
    notes: RAW RECORDING offers UNCOMPRESSED, LOSSLESS COMPRESSED, COMPRESSED. Specifications list JPEG, HEIF, RAW, TIFF.
  - key: raw_bit_depth
    label: RAW BIT DEPTH
    category: capture
    availability: not_documented
    domain:
      type: unspecified
    citations:
    - source: fuji-x-h2s-manual
      locator: Specifications
    notes: The Specifications page states no RAW bit depth. It lists HEIF as 4:2:2 10-bit, which does not describe RAW.
  - key: jpeg_capture
    label: JPEG
    category: capture
    availability: available
    domain:
      type: boolean
    citations:
    - source: fuji-x-h2s-manual
      locator: IMAGE QUALITY SETTING > IMAGE QUALITY
  - key: raw_jpeg_simultaneous
    label: IMAGE QUALITY (RAW + JPEG)
    category: capture
    availability: available
    domain:
      type: boolean
    citations:
    - source: fuji-x-h2s-manual
      locator: IMAGE QUALITY SETTING > IMAGE QUALITY
    notes: FINE+RAW and NORMAL+RAW record RAW and JPEG (or HEIF) together.
  - key: heif_capture
    label: SELECT JPEG/HEIF
    category: capture
    availability: available
    domain:
      type: boolean
    citations:
    - source: fuji-x-h2s-manual
      locator: IMAGE QUALITY SETTING > SELECT JPEG/HEIF
    notes: JPEG or HEIF selectable; selecting HEIF disables CLARITY and sets COLOR SPACE to sRGB.
  - key: jpeg_quality
    label: IMAGE QUALITY
    category: capture
    availability: available
    domain:
      type: enum
      values:
      - FINE
      - NORMAL
    citations:
    - source: fuji-x-h2s-manual
      locator: IMAGE QUALITY SETTING > IMAGE QUALITY
    notes: FINE+RAW, NORMAL+RAW and RAW are also selectable.
  - key: jpeg_color_spaces
    label: COLOR SPACE
    category: capture
    availability: available
    domain:
      type: enum
      values:
      - sRGB
      - Adobe RGB
    citations:
    - source: fuji-x-h2s-manual
      locator: IMAGE QUALITY SETTING > COLOR SPACE
  - key: in_camera_raw_conversion
    label: RAW CONVERSION
    category: workflow
    availability: available
    domain:
      type: boolean
    citations:
    - source: fuji-x-h2s-manual
      locator: The Playback Menu > RAW CONVERSION
    notes: Converts recorded RAW files in-camera; some settings are unavailable depending on the capture.
